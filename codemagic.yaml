workflows:
  ios-app:
    name: Bommes Dashboard iOS
    instance_type: mac_mini_m1
    
    # HIER DEINEN INTEGRATIONSNAMEN EINTRAGEN:
    integrations:
      app_store_connect: "Codemagic Build Server"
      
    environment:
      node: latest
      xcode: latest
      # Die Automatik findet das Profil jetzt, weil wir es vorhin erfolgreich erstellt haben!
      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.bommes.dashboard
        
    scripts:
      - name: 1. Pakete & Capacitor installieren
        script: |
          npm install
          npm install @capacitor/cli @capacitor/core @capacitor/ios capacitor-native-biometric
      - name: 2. Dummy-Webordner erstellen
        script: |
          mkdir -p www
          echo "<html><body>Bommes App</body></html>" > www/index.html
      - name: 3. iOS-Projekt nativ generieren
        script: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
      - name: 4. Face ID Berechtigung injizieren
        script: |
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'Wir nutzen Face ID für den sicheren Login ins Dashboard.'" ios/App/App/Info.plist
      - name: 5. Code Signing anwenden
        script: |
          cd ios/App
          # Wendet die automatisch geladenen Zertifikate sauber auf das frische Projekt an
          xcode-project use-profiles
      - name: 6. Build (.ipa)
        script: |
          cd ios/App
          xcode-project build-ipa --project App.xcodeproj --scheme App
          
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true