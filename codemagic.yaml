workflows:
  ios-app:
    name: Bommes Dashboard iOS
    instance_type: mac_mini_m1
    
    integrations:
      app_store_connect: "Codemagic Build Server"
      
    environment:
      node: latest
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.bommes.dashboard
        
    scripts:
      - name: 1. Umgebung & Pakete (Downgrade auf stabiles V5)
        script: |
          npm init -y
          # HIER IST DER FIX: Alle Kern-Komponenten und das Plugin auf Version 5 pinnen!
          npm install @capacitor/cli@5 @capacitor/core@5 @capacitor/ios@5 capacitor-native-biometric@5 --save
          mkdir -p www
          echo "<html><body>Bommes App</body></html>" > www/index.html
      - name: 2. iOS Projekt generieren & Version hochzaehlen
        script: |
          sed -i '' 's/com.capacitorjs.app/de.bommes.dashboard/g' capacitor.config.json || true
          rm -rf ios
          npx cap add ios
          
          # Sync findet das Plugin jetzt fehlerfrei und baut es ein
          npx cap sync ios
          
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'Wir nutzen Face ID fuer den sicheren Login ins Dashboard.'" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/App/App/Info.plist
      - name: 3. Code Signing anwenden
        script: |
          cd ios/App
          xcode-project use-profiles
      - name: 4. Build (.ipa)
        script: |
          cd ios/App
          xcode-project build-ipa --project App.xcodeproj --scheme App
          
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      
    publishing:
      app_store_connect:
        auth: integration