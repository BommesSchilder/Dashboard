workflows:
  ios-app:
    name: Bommes Dashboard iOS
    instance_type: mac_mini_m1
    
    integrations:
      app_store_connect: "Codemagic Build Server"
      
    environment:
      node: latest
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.bommes.dashboard
        
    scripts:
      - name: 1. Umgebung & Pakete
        script: |
          npm init -y
          npm install @capacitor/cli@5 @capacitor/core@5 @capacitor/ios@5 capacitor-native-biometric@latest --save
          
          # HIER IST DER FIX: Der Server-Block lädt jetzt dein Live-PHP-Dashboard!
          echo '{
            "appId": "de.bommes.dashboard",
            "appName": "Bommes Dashboard",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "url": "https://www.xpress-zulassung.de/backend/dashboard.php",
              "cleartext": true
            }
          }' > capacitor.config.json
          
          mkdir -p www
          echo "<html><body>Lade Dashboard...</body></html>" > www/index.html
          
      - name: 2. iOS Projekt generieren
        script: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'Wir nutzen Face ID fuer den sicheren Login ins Dashboard.'" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" ios/App/App/Info.plist
          
      - name: 3. Code Signing anwenden
        script: |
          cd ios/App
          xcode-project use-profiles
          
      - name: 4. Build (.ipa)
        script: |
          cd ios/App
          # HIER IST DER FIX: workspace statt project!
          xcode-project build-ipa --workspace App.xcworkspace --scheme App
          
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      
    publishing:
      app_store_connect:
        auth: integration