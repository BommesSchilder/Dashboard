workflows:
  ios-app:
    name: Bommes Dashboard iOS
    instance_type: mac_mini_m1
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Cloud-Native iOS Generation
        script: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
      - name: Inject Face ID Permission
        script: /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'Wir nutzen Face ID für den sicheren Login ins Dashboard.'" ios/App/App/Info.plist
      - name: Build iOS
        script: |
          cd ios/App
          xcodebuild build -workspace App.xcworkspace -scheme App -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO