workflows:
  ios-app:
    name: Bommes Dashboard iOS
    instance_type: mac_mini_m1
    
    integrations:
      app_store_connect: "Codemagic Build Server"
      
    environment:
      node: latest
      xcode: latest
      # Wir lassen den ios_signing Block hier weg, um den Vorab-Crash zu verhindern!
      
    scripts:
      - name: 1. Pakete & Capacitor installieren
        script: |
          npm install
          npm install @capacitor/cli @capacitor/core @capacitor/ios capacitor-native-biometric
      - name: 2. Dummy-Webordner erstellen
        script: |
          mkdir -p www
          echo "<html><body>Bommes App</body></html>" > www/index.html
      - name: 3. iOS-Projekt nativ generieren & ID korrigieren
        script: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          # Ersetzt die Standard-ID sicher durch deine, ohne die Datei zu zerstören!
          sed -i '' 's/com.capacitorjs.app/de.bommes.dashboard/g' ios/App/App.xcodeproj/project.pbxproj
      - name: 4. Face ID Berechtigung injizieren
        script: |
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'Wir nutzen Face ID für den sicheren Login ins Dashboard.'" ios/App/App/Info.plist
      - name: 5. Apple Zertifikate erzwingen & anwenden
        script: |
          keychain initialize
          # Zwingt Apple gnadenlos, das Profil jetzt zu erstellen
          app-store-connect fetch-signing-files "de.bommes.dashboard" --type IOS_APP_STORE --create
          keychain add-certificates
          cd ios/App
          # Da die Datei nicht mehr korrupt ist, klappt use-profiles jetzt fehlerfrei
          xcode-project use-profiles
      - name: 6. Build (.ipa)
        script: |
          cd ios/App
          xcode-project build-ipa --project App.xcodeproj --scheme App
          
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration