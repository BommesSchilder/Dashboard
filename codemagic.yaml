workflows:
  ios-app:
    name: Bommes Dashboard iOS
    instance_type: mac_mini_m1
    
    # HIER DEINEN INTEGRATIONS-NAMEN EINTRAGEN:
    integrations:
      app_store_connect: "Codemagic Build Server"
      
    environment:
      node: latest
      xcode: latest
      # ios_signing wurde hier absichtlich entfernt!
      
    scripts:
      - name: 1. Pakete & Capacitor installieren
        script: |
          npm install
          npm install @capacitor/cli @capacitor/core @capacitor/ios capacitor-native-biometric
      - name: 2. Dummy-Webordner erstellen
        script: |
          mkdir -p www
          echo "<html><body>Bommes App</body></html>" > www/index.html
      - name: 3. iOS-Projekt nativ generieren
        script: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
      - name: 4. Face ID Berechtigung injizieren
        script: |
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'Wir nutzen Face ID für den sicheren Login ins Dashboard.'" ios/App/App/Info.plist
      - name: 5. Zertifikate ZWINGEND erstellen & aktivieren
        script: |
          # 1. Schlüsselbund auf dem Mac vorbereiten
          keychain initialize
          
          # 2. Zertifikate bei Apple erzwingen (--create) und sofort in den Speicher laden (source)
          source <(app-store-connect fetch-signing-files "de.bommes.dashboard" --type IOS_APP_STORE --create)
          
          # 3. Das geladene Zertifikat auf dem Mac installieren
          keychain add-certificates
          
          # 4. Dem Xcode-Projekt die Bundle-ID und das Zertifikat aufzwingen
          cd ios/App
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = de.bommes.dashboard;/g' App.xcodeproj/project.pbxproj
          xcode-project use-profiles
      - name: 6. Code Signing & Build (.ipa)
        script: |
          cd ios/App
          xcode-project build-ipa --project App.xcodeproj --scheme App
          
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: trueflight: true