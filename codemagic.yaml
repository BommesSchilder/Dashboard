workflows:
  ios-app:
    name: Bommes Dashboard iOS
    instance_type: mac_mini_m1
    
    # HIER DEINEN INTEGRATIONSNAMEN EINTRAGEN:
    integrations:
      app_store_connect: "Codemagic Build Server"
      
    environment:
      node: latest
      xcode: latest
      # ios_signing ist hier komplett GELÖSCHT, um den Vorab-Check zu verhindern!
      
    scripts:
      - name: 1. Pakete & Capacitor installieren
        script: |
          npm install
          npm install @capacitor/cli @capacitor/core @capacitor/ios capacitor-native-biometric
      - name: 2. Dummy-Webordner erstellen
        script: |
          mkdir -p www
          echo "<html><body>Bommes App</body></html>" > www/index.html
      - name: 3. iOS-Projekt nativ generieren
        script: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
      - name: 4. Face ID Berechtigung injizieren
        script: |
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'Wir nutzen Face ID für den sicheren Login ins Dashboard.'" ios/App/App/Info.plist
      - name: 5. Zertifikate generieren & Xcode konfigurieren
        script: |
          # 1. Bereitet den Schlüsselbund des Cloud-Macs vor
          keychain initialize
          
          # 2. Erzwingt die Neuerstellung des Zertifikats bei Apple!
          app-store-connect fetch-signing-files "de.bommes.dashboard" --type IOS_APP_STORE --create
          
          # 3. Lädt das brandneue Zertifikat in den Schlüsselbund
          keychain add-certificates
          
          cd ios/App
          
          # 4. Zwingt Apple von Automatik auf Cloud-Signing (Behebt Error 65!)
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' App.xcodeproj/project.pbxproj
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = de.bommes.dashboard;/g' App.xcodeproj/project.pbxproj
          
          # 5. Verbindet das frisch erstellte Zertifikat final mit der App
          xcode-project use-profiles
      - name: 6. Build (.ipa)
        script: |
          cd ios/App
          xcode-project build-ipa --project App.xcodeproj --scheme App
          
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true