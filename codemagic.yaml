workflows:
  ios-app:
    name: Bommes Dashboard iOS
    instance_type: mac_mini_m1
    
    integrations:
      app_store_connect: "Codemagic Build Server"
      
    environment:
      node: latest
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.bommes.dashboard
        
    scripts:
      - name: 1. Umgebung & Pakete
        script: |
          npm init -y
          npm install @capacitor/cli@5 @capacitor/core@5 @capacitor/ios@5 capacitor-native-biometric@latest --save
          
          echo '{
            "appId": "de.bommes.dashboard",
            "appName": "Bommes Dashboard",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "url": "https://www.xpress-zulassung.de/backend/dashboard.php",
              "cleartext": true
            }
          }' > capacitor.config.json
          
          mkdir -p www
          echo "<html><body>Lade Dashboard...</body></html>" > www/index.html
          
      - name: 2. iOS Projekt mit eigenem Logo sicher generieren
        script: |
          # 1. SICHERUNG: Eigenes Logo vor der Löschung in einen sicheren Temp-Ordner retten
          mkdir -p /tmp/my_icons
          if [ -d "ios/App/App/Assets.xcassets/AppIcon.appiconset" ]; then
            cp -r ios/App/App/Assets.xcassets/AppIcon.appiconset /tmp/my_icons/
          fi
          
          # 2. FRISCHES PROJEKT: Generiert das iOS Projekt samt fehlendem Podfile komplett neu
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          
          # 3. LOGO WIEDERHERSTELLEN: Das gerettete Logo wieder einfügen
          if [ -d "/tmp/my_icons/AppIcon.appiconset" ]; then
            rm -rf ios/App/App/Assets.xcassets/AppIcon.appiconset
            cp -r /tmp/my_icons/AppIcon.appiconset ios/App/App/Assets.xcassets/
          fi
          
          # 4. FACE ID Erlaubnis eintragen
          /usr/libexec/PlistBuddy -c "Set :NSFaceIDUsageDescription 'Wir nutzen Face ID fuer den sicheren Login ins Dashboard.'" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'Wir nutzen Face ID fuer den sicheren Login ins Dashboard.'" ios/App/App/Info.plist
          
          # Build-Nummer hochzählen
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" ios/App/App/Info.plist
          
      - name: 3. CocoaPods installieren (Baut Face ID ein)
        script: |
          cd ios/App
          pod install --repo-update
          
      - name: 4. Code Signing anwenden
        script: |
          cd ios/App
          xcode-project use-profiles
          
      - name: 5. Build (.ipa)
        script: |
          cd ios/App
          xcode-project build-ipa --workspace App.xcworkspace --scheme App
          
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      
    publishing:
      app_store_connect:
        auth: integration