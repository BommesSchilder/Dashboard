workflows:
  ios-app:
    name: Bommes Dashboard iOS
    instance_type: mac_mini_m1
    
    integrations:
      app_store_connect: "Codemagic Build Server"
      
    environment:
      node: latest
      xcode: latest
      
    scripts:
      - name: 1. Umgebung vorbereiten (Node & Web-Ordner)
        script: |
          npm install
          npm install @capacitor/cli @capacitor/core @capacitor/ios capacitor-native-biometric
          mkdir -p www
          echo "<html><body>Bommes App</body></html>" > www/index.html
          
      - name: 2. iOS Projekt mit richtiger ID generieren
        script: |
          # Wir setzen deine ID, BEVOR iOS gebaut wird. Das verhindert alle Konflikte.
          sed -i '' 's/com.capacitorjs.app/de.bommes.dashboard/g' capacitor.config.json || true
          
          # iOS Ordner frisch generieren
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          
          # Face ID Berechtigung setzen
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'Wir nutzen Face ID für den sicheren Login ins Dashboard.'" ios/App/App/Info.plist
          
      - name: 3. Zertifikate holen UND sofort bauen (All-in-One)
        script: |
          # Schlüsselbund initialisieren
          keychain initialize
          
          # Zertifikat bei Apple erzwingen und im aktuellen Skript-Gedächtnis speichern!
          source <(app-store-connect fetch-signing-files "de.bommes.dashboard" --type IOS_APP_STORE --create)
          
          # Zertifikat dem Mac übergeben
          keychain add-certificates
          
          # Zum Projekt wechseln
          cd ios/App
          
          # Xcode anweisen, das geladene Zertifikat zu nutzen
          xcode-project use-profiles
          
          # Da wir noch im selben Schritt sind, klappt das Bauen jetzt fehlerfrei!
          xcode-project build-ipa --project App.xcodeproj --scheme App
          
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      
    publishing:
      app_store_connect:
        auth: integration