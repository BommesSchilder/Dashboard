workflows:
  ios-app:
    name: Bommes Dashboard iOS
    instance_type: mac_mini_m1
    
    integrations:
      app_store_connect: "Codemagic Build Server"
      
    environment:
      node: latest
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.bommes.dashboard
        
    scripts:
      - name: 1. Umgebung & Pakete
        script: |
          npm init -y
          
          # NEU: Wir schreiben die Capacitor-Konfiguration direkt und fehlerfrei selbst!
          echo '{
            "appId": "de.bommes.dashboard",
            "appName": "Bommes Dashboard",
            "webDir": "www",
            "bundledWebRuntime": false
          }' > capacitor.config.json
          
          mkdir -p www
          echo "<html><body>Bommes App</body></html>" > www/index.html
          
          # Pakete installieren
          npm install @capacitor/cli@5 @capacitor/core@5 @capacitor/ios@5 capacitor-native-biometric@5 --save
          
      - name: 2. iOS Projekt generieren & Version hochzaehlen
        script: |
          rm -rf ios
          
          # FIX: Direkter Pfad zur Datei - umgeht jeden npx-Bug!
          ./node_modules/.bin/cap add ios
          ./node_modules/.bin/cap sync ios
          
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'Wir nutzen Face ID fuer den sicheren Login ins Dashboard.'" ios/App/App/Info.plist
          
          # Setzt die Version automatisch hoch (TestFlight-Fix)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" ios/App/App/Info.plist
          
      - name: 3. Code Signing anwenden
        script: |
          cd ios/App
          xcode-project use-profiles
          
      - name: 4. Build (.ipa)
        script: |
          cd ios/App
          xcode-project build-ipa --project App.xcodeproj --scheme App
          
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      
    publishing:
      app_store_connect:
        auth: integration