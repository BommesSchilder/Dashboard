workflows:
  ios-app:
    name: Bommes Dashboard iOS
    instance_type: mac_mini_m1
    
    integrations:
      app_store_connect: "Codemagic Build Server"
      
    environment:
      node: latest
      xcode: latest
      
    scripts:
      - name: 1. Pakete & Capacitor installieren
        script: |
          npm install
          npm install @capacitor/cli @capacitor/core @capacitor/ios capacitor-native-biometric
      - name: 2. Dummy-Webordner erstellen
        script: |
          mkdir -p www
          echo "<html><body>Bommes App</body></html>" > www/index.html
      - name: 3. iOS-Projekt nativ generieren
        script: |
          # Ändert die ID in der Config, BEVOR iOS gebaut wird. Das ist zu 100 % sicher.
          sed -i '' 's/com.capacitorjs.app/de.bommes.dashboard/g' capacitor.config.json || true
          sed -i '' 's/com.capacitorjs.app/de.bommes.dashboard/g' capacitor.config.ts || true
          rm -rf ios
          npx cap add ios
          npx cap sync ios
      - name: 4. Face ID Berechtigung injizieren
        script: |
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'Wir nutzen Face ID für den sicheren Login ins Dashboard.'" ios/App/App/Info.plist
      - name: 5. Apple Zertifikate herunterladen und anwenden
        script: |
          keychain initialize
          # HIER WAR MEIN FEHLER: Das "source <( )" speichert das Zertifikat für Schritt 6!
          source <(app-store-connect fetch-signing-files "de.bommes.dashboard" --type IOS_APP_STORE --create)
          keychain add-certificates
          
          cd ios/App
          # Schaltet die Xcode-Automatik ab und wendet das geladene Profil an
          xcode-project use-profiles
      - name: 6. Build (.ipa)
        script: |
          cd ios/App
          xcode-project build-ipa --project App.xcodeproj --scheme App
          
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration