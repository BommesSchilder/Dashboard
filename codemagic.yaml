workflows:
  ios-app:
    name: Bommes Dashboard iOS
    instance_type: mac_mini_m1
    
    # HIER DEINEN NAMEN EINTRAGEN:
    integrations:
      app_store_connect: "Codemagic Build Server"
      
    environment:
      node: latest
      xcode: latest
      # Holt sich die Zertifikate nun sicher aus dem Codemagic-Tresor
      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.bommes.dashboard
        
    scripts:
      - name: 1. Umgebung vorbereiten
        script: |
          npm install
          npm install @capacitor/cli @capacitor/core @capacitor/ios capacitor-native-biometric
          mkdir -p www
          echo "<html><body>Bommes App</body></html>" > www/index.html
      - name: 2. iOS Projekt nativ generieren
        script: |
          sed -i '' 's/com.capacitorjs.app/de.bommes.dashboard/g' capacitor.config.json || true
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'Wir nutzen Face ID für den sicheren Login ins Dashboard.'" ios/App/App/Info.plist
      - name: 3. Code Signing anwenden
        script: |
          cd ios/App
          xcode-project use-profiles
      - name: 4. Build (.ipa)
        script: |
          cd ios/App
          xcode-project build-ipa --project App.xcodeproj --scheme App
          
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      
    publishing:
      app_store_connect:
        auth: integration