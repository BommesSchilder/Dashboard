workflows:
  ios-app:
    name: Bommes Dashboard iOS
    instance_type: mac_mini_m1
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: System Cleanup & Prep
        script: |
          mkdir -p www
          npm install
          npm install @capacitor/ios capacitor-native-biometric
      - name: Generate Clean iOS Project
        script: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
      - name: Build Apple Workspace (CocoaPods)
        script: |
          cd ios/App
          pod install
      - name: Apply FaceID Security Policy
        script: /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'Wir nutzen Face ID für den sicheren Login ins Dashboard.'" ios/App/App/Info.plist
      - name: Compile iOS App
        script: xcodebuild build -workspace ios/App/App.xcworkspace -scheme App -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO