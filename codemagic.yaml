workflows:
  ios-app:
    name: Bommes Dashboard iOS
    instance_type: mac_mini_m1
    
    # HIER WIEDER DEINEN NAMEN EINTRAGEN:
    integrations:
      app_store_connect: "Codemagic Build Server"
      
    environment:
      node: latest
      xcode: latest
      # Lädt die Zertifikate über deinen API-Schlüssel global in den Zwischenspeicher des Macs
      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.bommes.dashboard
        
    scripts:
      - name: 1. Pakete & Capacitor installieren
        script: |
          npm install
          npm install @capacitor/cli @capacitor/core @capacitor/ios capacitor-native-biometric
      - name: 2. Dummy-Webordner erstellen
        script: |
          mkdir -p www
          echo "<html><body>Bommes App</body></html>" > www/index.html
      - name: 3. iOS-Projekt nativ generieren
        script: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
      - name: 4. Face ID Berechtigung injizieren
        script: |
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'Wir nutzen Face ID für den sicheren Login ins Dashboard.'" ios/App/App/Info.plist
      - name: 5. Bundle-ID & Zertifikate in Xcode erzwingen
        script: |
          cd ios/App
          # Zur Sicherheit: Überschreibt jede falsche Bundle-ID direkt im Apple-Quellcode
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = de.bommes.dashboard;/g' App.xcodeproj/project.pbxproj
          # Zwingt das frische Projekt, die vorab geladenen Zertifikate zu nutzen
          xcode-project use-profiles
      - name: 6. Code Signing & Build (.ipa)
        script: |
          cd ios/App
          xcode-project build-ipa --project App.xcodeproj --scheme App
          
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true