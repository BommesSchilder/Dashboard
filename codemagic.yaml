workflows:
  ios-app:
    name: Bommes Dashboard iOS
    instance_type: mac_mini_m1
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Node Dependencies
        script: npm install
      - name: Generate iOS Folder
        script: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
      - name: Install Apple CocoaPods (Creates Workspace)
        script: |
          cd ios/App
          pod install
      - name: Inject Face ID Permission
        script: /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'Wir nutzen Face ID für den sicheren Login ins Dashboard.'" ios/App/App/Info.plist
      - name: Build iOS
        script: xcodebuild build -workspace ios/App/App.xcworkspace -scheme App -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO